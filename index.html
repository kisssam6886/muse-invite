:root{

  --ok:#2FA35E; --shadow:0 6px 30px rgba(20,18,40,.10); --code-fg:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#08080C; --card:#141419; --ink:#F3F3F6; --muted:#A0A0AA; --faint:#6E6E78;
  --line:#24242E; --accent:#8C7BFF; --accent2:#B18BFF; --amber:#E9B762; --amber-bg:#241C10;
  --ok:#54C98A; --shadow:0 8px 34px rgba(0,0,0,.55);
}}
:root[data-theme=dark]{

  --line:#24242E; --accent:#8C7BFF; --accent2:#B18BFF; --amber:#E9B762; --amber-bg:#241C10;
  --ok:#54C98A; --shadow:0 8px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","PingFang HK","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background-image:radial-gradient(120% 60% at 82% -8%,rgba(109,90,230,.16),transparent 60%);background-attachment:fixed}
a{color:inherit}
.wrap{max-width:540px;margin:0 auto;padding:20px 18px 72px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:16px;font-weight:650}
.brand .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.langs{display:inline-flex;gap:3px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:999px}
.langs button{border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;
  padding:6px 11px;border-radius:999px;cursor:pointer;font-family:inherit}
.langs button[aria-selected=true]{background:var(--accent);color:#fff}
h1{font-size:31px;line-height:1.18;font-weight:750;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin-top:12px;font-size:16px;line-height:1.55;color:var(--muted)}
.codecard{margin:24px 0 14px;padding:26px 22px 22px;border-radius:26px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.codecard:active{transform:scale(.992)}
.codecard .k{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.82}
.codecard .code{margin:8px 0 4px;font-size:52px;line-height:1;font-weight:800;letter-spacing:.16em;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;align-items:center;gap:14px}
.codecard .cp{margin-left:auto;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);
  display:grid;place-items:center;flex:none}
.codecard .cp svg{width:19px;height:19px}
.codecard .tip{font-size:13.5px;opacity:.85;margin-top:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btn{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-size:15px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.primary{grid-column:1/-1;height:56px;border:none;font-size:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 20px rgba(109,90,230,.32)}
.btn.primary:active,.btn:active{transform:translateY(1px)}
.redeemrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:14px 0}
.qr{width:96px;height:96px;padding:9px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);flex:none}
.qr svg{width:100%;height:100%;display:block}
.qrlab{font-size:12px;color:var(--faint);text-align:center;margin-top:5px}
.callout{display:flex;gap:12px;align-items:flex-start;margin:18px 0;padding:15px 16px;border-radius:16px;
  background:var(--amber-bg);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.callout .ic{flex:none;font-size:18px;line-height:1.3}
.callout b{color:var(--amber)}
.callout p{font-size:14px;line-height:1.5;color:var(--ink)}
.sec{margin-top:34px}
.sec h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:14px}
.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:none;padding-top:2px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.step .b{font-size:15px;line-height:1.5}
.step .b b{font-weight:650}
.step .b span{color:var(--muted)}
.step code{font-family:ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:1px 7px;font-weight:700;letter-spacing:.08em}
.rules{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 18px}
.rules .r{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
.rules .r:first-child{border-top:none}
.rules .r .t{flex:none;font-size:18px;width:24px;text-align:center}
.rules .r b{font-weight:650}
.rules .r span{color:var(--muted);display:block;margin-top:2px;font-size:13.5px}
.foot{margin-top:30px;font-size:12.5px;color:var(--faint);line-height:1.6;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:12px 20px;border-radius:999px;
  box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s;z-index:20;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;color:var(--ok)}
@media (max-width:400px){h1{font-size:27px}.codecard .code{font-size:44px}}
</style>

  share:"Try Muse, your personal AI assistant! Redeem my invite code in Settings within 48 hours of joining and we each get 1 billion Muse tokens.\nCode: WMFYLO\nhttps://muse.ai/join"}
};
let lang="zh-CN";
function render(){
 const d=I18N[lang];
 document.documentElement.lang=lang; document.documentElement.setAttribute("data-lang",lang);
 document.querySelectorAll("[data-t]").forEach(el=>{const k=el.getAttribute("data-t"); if(d[k]!=null){ if(k==="h1") el.innerHTML=d[k]; else el.textContent=d[k];}});
 document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.lang===lang));
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang; render();});
let tt;
function toast(msg){const t=document.getElementById("toast");document.getElementById("toasttext").textContent=msg;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1900);}
async function copy(text,msg){try{await navigator.clipboard.writeText(text);}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(_){}ta.remove();}toast(msg);}
document.getElementById("codecard").onclick=()=>copy(CODE,I18N[lang].toast_code);
document.getElementById("codecard").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();copy(CODE,I18N[lang].toast_code);}};
document.getElementById("copyCode").onclick=e=>{e.stopPropagation();copy(CODE,I18N[lang].toast_code);};
document.getElementById("copyMsg").onclick=()=>copy(I18N[lang].share,I18N[lang].toast_msg);
render();
</script>
</body>
</html>
